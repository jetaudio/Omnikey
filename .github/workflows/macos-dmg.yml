name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Sources/Omnikey/engine/**'
      - 'Sources/Omnikey/macOS/**'
      - 'scripts/build-macos-dmg.sh'
      - '.github/workflows/macos-dmg.yml'
      - 'tests/**'
      - 'scripts/test-*.sh'
      - 'scripts/fetch-rime.sh'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Engine regression tests
        run: bash scripts/test-engine.sh
      - name: Chinese (Rime) input tests
        run: bash scripts/test-rime.sh
      - name: macOS event regression tests
        run: bash scripts/test-macos-events.sh
      - name: macOS updater regression tests
        run: bash scripts/test-macos-updater.sh
      - name: Build and verify universal DMG
        run: bash scripts/build-macos-dmg.sh
      - name: Upload DMG and build information
        uses: actions/upload-artifact@v4
        with:
          name: Omnikey-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30
