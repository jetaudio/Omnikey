name: MSBuild

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .\Sources\Omnikey\win32\Omnikey\Omnikey.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Engine regression tests with Windows key codes
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        @"
        @echo off
        call "$vs\VC\Auxiliary\Build\vcvars64.bat"
        if errorlevel 1 exit /b 1
        cl /nologo /EHsc /std:c++14 /utf-8 /I Sources\Omnikey\engine Sources\Omnikey\engine\*.cpp tests\engine_regression.cpp /Fe:engine-tests.exe
        if errorlevel 1 exit /b 1
        engine-tests.exe
        exit /b %errorlevel%
        "@ | Set-Content -Path engine-tests.cmd
        cmd /c engine-tests.cmd
        if ($LASTEXITCODE -ne 0) { throw 'Engine regression tests failed' }

    - name: Build and verify x86 and x64 executables
      shell: pwsh
      run: |
        foreach ($arch in @('x86', 'x64')) {
          $platform = if ($arch -eq 'x86') { 'Win32' } else { 'x64' }
          $output = "$env:GITHUB_WORKSPACE\ArtifactOutput\$arch\"
          foreach ($project in @('Omnikey', 'OmnikeyUpdate')) {
            $source = "$env:GITHUB_WORKSPACE\Sources\Omnikey\win32\Omnikey\$project\$project.vcxproj"
            $intermediate = "$env:GITHUB_WORKSPACE\build\obj\$project\$arch\"
            msbuild $source -m -target:Rebuild -p:Configuration=Release "-p:Platform=$platform" "-p:OutDir=$output" "-p:IntDir=$intermediate"
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project $arch" }
          }
          $main = if ($arch -eq 'x86') { 'Omnikey32.exe' } else { 'Omnikey64.exe' }
          foreach ($file in @($main, 'OmnikeyUpdate.exe')) {
            $path = Join-Path $output $file
            if (!(Test-Path $path)) { throw "Missing artifact: $path" }
            $data = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($data, 0x3c)
            $machine = [BitConverter]::ToUInt16($data, $pe + 4)
            $expected = if ($arch -eq 'x86') { 0x14c } else { 0x8664 }
            if ($machine -ne $expected) { throw "Wrong architecture: $path" }
          }
          python scripts/fetch-rime-windows.py $arch $output
          if ($LASTEXITCODE -ne 0) { throw "Rime packaging failed: $arch" }
          Copy-Item -LiteralPath (Join-Path $output 'OmnikeyUpdate.exe') -Destination (Join-Path $output "Rime/bin/$arch/OmnikeyUpdate.exe") -Force
          ./scripts/test-windows-rime.ps1 -Architecture $arch -Bundle (Join-Path $output 'Rime')
        }

    - name: Verify complete Windows release packages
      shell: pwsh
      run: |
        $version = (Get-Content version.json -Raw | ConvertFrom-Json).latestWinVersion.versionName
        python scripts/package-windows-release.py $version ArtifactOutput dist/release
        if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
        python tests/windows_update_package_tests.py "dist/release/Omnikey-$version-Windows.zip"
        if ($LASTEXITCODE -ne 0) { throw 'Updater package tests failed' }
        foreach ($arch in @('x64', 'x86')) {
          ./scripts/test-windows-rime.ps1 -Architecture $arch -Bundle "$env:GITHUB_WORKSPACE/dist/release/staging/$version/combined/Rime"
        }

    - name: Upload a Build Artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: Omnikey
        path: |
          ArtifactOutput/x86/*.exe
          ArtifactOutput/x86/Rime/**
          ArtifactOutput/x64/*.exe
          ArtifactOutput/x64/Rime/**
          dist/release/*.zip
          dist/release/SHA256SUMS.txt
        if-no-files-found: error

    outputs:
      subject-name: Omnikey
      subject-digest: ${{steps.upload.outputs.artifact-digest}}

  attest:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{needs.build.outputs.subject-name}}
        subject-digest: sha256:${{needs.build.outputs.subject-digest}}
