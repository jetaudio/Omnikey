# Omnikey's Rime configuration: one simplified Pinyin schema. Omnikey switches
# between V, E and 中 itself, so Rime's own ASCII toggles are left unbound.
patch:
  schema_list:
    - schema: pinyin_simp
  menu/page_size: 7
  ascii_composer/switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: noop
    Eisu_toggle: noop
